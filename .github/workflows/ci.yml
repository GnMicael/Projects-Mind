name: CI

# Roda em pull requests e em qualquer branch que não seja a main
# (a main é testada dentro do workflow de deploy).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # só usa cache quando o package-lock.json já foi commitado
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          # valores de mentira: o build não conecta ao Firebase
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci-placeholder

      - name: Auditoria de dependências (não bloqueia)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  backend:
    name: Backend (sintaxe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: ${{ hashFiles('backend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Verificar sintaxe dos arquivos
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Auditoria de dependências (não bloqueia)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
